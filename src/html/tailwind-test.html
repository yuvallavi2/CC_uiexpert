<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Test - Eventit Design</title>
  <link rel="stylesheet" href="../css/tailwind-output.css">
</head>
<body>
  <div class="container-page">
    <div class="card">
      <h1 class="h1">Tailwind CSS Test - Eventit Design System</h1>

      <div class="stack">
        <p class="muted">This is a test page to verify Tailwind CSS is working correctly.</p>

        <div class="cluster">
          <button class="btn btn-primary">Primary Button</button>
          <button class="btn btn-danger">Danger Button</button>
          <button class="btn btn-ghost">Ghost Button</button>
        </div>

        <div>
          <label class="caption">Test Input</label>
          <input type="text" class="input" placeholder="Enter some text...">
        </div>

        <div class="cluster">
          <span class="badge badge-success">Success</span>
          <span class="badge badge-info">Info</span>
          <span class="badge badge-danger">Danger</span>
          <span class="badge badge-warning">Warning</span>
        </div>

        <div class="card--soft">
          <h2 class="h2">Nested Card</h2>
          <p>This demonstrates the card--soft variant.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
