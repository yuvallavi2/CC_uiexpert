<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Card Component</title>
  <link rel="stylesheet" href="../css/tailwind-output.css">
</head>
<body>
  <div class="container-page">
    <div class="card">
      <h2 class="h2">Event Details</h2>

      <form class="stack">
        <!-- Event ID (Read-only) -->
        <div class="u-flex u-gap-3">
          <label for="Event_ID" class="form-label">Event ID:</label>
          <input
            type="text"
            id="Event_ID"
            name="Event_ID"
            class="input"
            readonly
            placeholder="##########"
            maxlength="10">
        </div>

        <!-- Button Visibility -->
        <div class="u-flex u-gap-3">
          <label for="P_pBtnVisibility" class="form-label">Button Visibility:</label>
          <select id="P_pBtnVisibility" name="P_pBtnVisibility" class="select">
            <option value="">Select visibility</option>
            <option value="True">True</option>
            <option value="False">False</option>
          </select>
        </div>

        <!-- Event Type (Required) -->
        <div class="u-flex u-gap-3">
          <label for="ComboEventType" class="form-label">Event Type: <span class="required">*</span></label>
          <select id="ComboEventType" name="ComboEventType" class="select" required>
            <option value="">Select event type</option>
            <option value="conference">Conference</option>
            <option value="workshop">Workshop</option>
            <option value="seminar">Seminar</option>
            <option value="meeting">Meeting</option>
            <option value="social">Social Event</option>
          </select>
        </div>

        <!-- Event Name -->
        <div class="u-flex u-gap-3">
          <label for="Event_Name" class="form-label">Event Name:</label>
          <input
            type="text"
            id="Event_Name"
            name="Event_Name"
            class="input"
            maxlength="50"
            placeholder="Enter event name">
        </div>

        <!-- Event Location -->
        <div class="u-flex u-gap-3">
          <label for="ComboEventLocation" class="form-label">Event Location:</label>
          <select id="ComboEventLocation" name="ComboEventLocation" class="select">
            <option value="">Select location</option>
            <option value="main-hall">Main Hall</option>
            <option value="conference-room-a">Conference Room A</option>
            <option value="conference-room-b">Conference Room B</option>
            <option value="auditorium">Auditorium</option>
            <option value="online">Online</option>
          </select>
        </div>

        <!-- Date Range -->
        <div class="cluster">
          <div class="u-flex u-gap-3">
            <label for="Start_Date" class="form-label">Start Date: <span class="required">*</span></label>
            <input
              type="date"
              id="Start_Date"
              name="Start_Date"
              class="input"
              required>
          </div>

          <div class="u-flex u-gap-3">
            <label for="End_Date" class="form-label">End Date: <span class="required">*</span></label>
            <input
              type="date"
              id="End_Date"
              name="End_Date"
              class="input"
              required>
          </div>
        </div>

        <!-- Time Range -->
        <div class="cluster">
          <div class="u-flex u-gap-3">
            <label for="EventStartTime" class="form-label">Start Time:</label>
            <input
              type="time"
              id="EventStartTime"
              name="EventStartTime"
              class="input">
          </div>

          <div class="u-flex u-gap-3">
            <label for="Event_Inforrmation_End_Time" class="form-label">End Time:</label>
            <input
              type="time"
              id="Event_Inforrmation_End_Time"
              name="Event_Inforrmation_End_Time"
              class="input">
          </div>
        </div>

        <!-- Attendee Limits -->
        <div class="cluster">
          <div class="u-flex u-gap-3">
            <label for="Minimum_Attendees" class="form-label">Minimum Attendees:</label>
            <input
              type="number"
              id="Minimum_Attendees"
              name="Minimum_Attendees"
              class="input"
              min="0"
              max="99999"
              placeholder="0">
          </div>

          <div class="u-flex u-gap-3">
            <label for="Maximum_Attendees" class="form-label">Maximum Attendees:</label>
            <input
              type="number"
              id="Maximum_Attendees"
              name="Maximum_Attendees"
              class="input"
              min="0"
              max="99999"
              placeholder="0">
          </div>
        </div>

        <!-- Registered Members Section -->
        <fieldset id="SfRegisteredMembers" class="card--soft u-mt-4">
          <legend class="h2">Registered Members</legend>
          <div class="muted">
            <p>This section displays wireframe placeholder for registered members functionality.</p>
            <div style="border: 2px dashed var(--color-border); padding: var(--space-4); text-align: center; margin-top: var(--space-3);">
              <span class="caption">Registered Members List Wireframe</span>
              <br>
              <span class="caption muted">Component implementation placeholder</span>
            </div>
          </div>
        </fieldset>

        <!-- Action Buttons -->
        <div class="cluster u-mt-4">
          <button type="submit" id="btnSave" class="btn btn--primary">
            Save
          </button>

          <button type="button" id="btnQuit" class="btn btn--ghost">
            Quit
          </button>
        </div>
      </form>
    </div>
  </div>

  <style>
    .form-label {
      min-width: 140px;
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
      white-space: nowrap;
    }

    .required {
      color: var(--color-danger);
    }

    .cluster > div {
      flex: 1;
      min-width: 250px;
    }

    input[readonly] {
      background-color: var(--color-bg-hover);
      cursor: not-allowed;
    }

    fieldset {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
    }

    legend {
      padding: 0 var(--space-2);
      color: var(--color-text-primary);
    }
  </style>
</body>
</html>
