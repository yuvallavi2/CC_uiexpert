<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Card</title>
  <link rel="stylesheet" href="../css/tailwind-output.css">
</head>
<body>
  <div class="container-page">
    <div class="card">
      <h1 class="h1">Event Card</h1>

      <form class="stack">
        <div class="cluster">
          <div style="flex: 1;">
            <label for="Event_ID" class="caption">Event ID</label>
            <input
              type="text"
              id="Event_ID"
              name="Event_ID"
              class="input"
              placeholder="##########"
              maxlength="10"
              pattern="\d{1,10}"
              readonly
              disabled
            >
          </div>

          <div style="flex: 1;">
            <label for="P_pBtnVisibility" class="caption">Button Visibility</label>
            <select
              id="P_pBtnVisibility"
              name="P_pBtnVisibility"
              class="select"
            >
              <option value="">Select...</option>
              <option value="True">True</option>
              <option value="False">False</option>
            </select>
          </div>
        </div>

        <div>
          <label for="ComboEventType" class="caption">
            Event Type
            <span style="color: var(--color-danger);">*</span>
          </label>
          <select
            id="ComboEventType"
            name="ComboEventType"
            class="select"
            required
          >
            <option value="">Select event type...</option>
          </select>
        </div>

        <div>
          <label for="Event_Name" class="caption">
            Event Name
            <span style="color: var(--color-danger);">*</span>
          </label>
          <input
            type="text"
            id="Event_Name"
            name="Event_Name"
            class="input"
            placeholder="Enter event name"
            maxlength="50"
            required
          >
        </div>

        <div>
          <label for="ComboEventLocation" class="caption">Event Location</label>
          <select
            id="ComboEventLocation"
            name="ComboEventLocation"
            class="select"
          >
            <option value="">Select location...</option>
          </select>
        </div>

        <div class="cluster">
          <div style="flex: 1;">
            <label for="Start_Date" class="caption">
              Start Date
              <span style="color: var(--color-danger);">*</span>
            </label>
            <input
              type="date"
              id="Start_Date"
              name="Start_Date"
              class="input"
              required
            >
          </div>

          <div style="flex: 1;">
            <label for="End_Date" class="caption">
              End Date
              <span style="color: var(--color-danger);">*</span>
            </label>
            <input
              type="date"
              id="End_Date"
              name="End_Date"
              class="input"
              required
            >
          </div>
        </div>

        <div class="cluster">
          <div style="flex: 1;">
            <label for="EventStartTime" class="caption">Start Time</label>
            <input
              type="time"
              id="EventStartTime"
              name="EventStartTime"
              class="input"
            >
          </div>

          <div style="flex: 1;">
            <label for="Event_Inforrmation_End_Time" class="caption">End Time</label>
            <input
              type="time"
              id="Event_Inforrmation_End_Time"
              name="Event_Inforrmation_End_Time"
              class="input"
            >
          </div>
        </div>

        <div class="cluster">
          <div style="flex: 1;">
            <label for="Minimum_Attendees" class="caption">Minimum Attendees</label>
            <input
              type="number"
              id="Minimum_Attendees"
              name="Minimum_Attendees"
              class="input"
              placeholder="#####"
              min="0"
              max="99999"
            >
          </div>

          <div style="flex: 1;">
            <label for="Maximum_Attendees" class="caption">Maximum Attendees</label>
            <input
              type="number"
              id="Maximum_Attendees"
              name="Maximum_Attendees"
              class="input"
              placeholder="#####"
              min="0"
              max="99999"
            >
          </div>
        </div>

        <div class="card--soft" style="margin-top: var(--space-6);">
          <h2 class="h2">Registered Members</h2>
          <div style="padding: var(--space-8); text-align: center; color: var(--color-text-secondary);">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="48"
              height="48"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="margin: 0 auto var(--space-3);"
            >
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <p class="muted">Registered members section placeholder</p>
            <p class="caption">SubForm: SfRegisteredMembers</p>
          </div>
        </div>

        <div class="cluster" style="margin-top: var(--space-6); justify-content: flex-end;">
          <button
            type="submit"
            id="btnSave"
            name="btnSave"
            class="btn btn--primary"
          >
            Save
          </button>

          <button
            type="button"
            id="btnQuit"
            name="btnQuit"
            class="btn btn--ghost"
          >
            CreateQuit
          </button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
